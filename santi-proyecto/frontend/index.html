<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
</head>
<body>
    <div>
        <h1>listas de tareas</h1>
        <div>   
            <input type="text" id="taskInput" placeholder="titulo de la tarea">
            <input type="text" id="descriptionInput" placeholder="descripcion de la tarea">
            <button onclick="GuardarTarea()">Guardar Tarea</button>
        </div>
        <div id="Lista de tareas">
           <!-- Aquí se mostrarán las tareas guardadas -->
        </div>
    </div>
    <script>    
        //importantes: cuando despleguemos el backend en railway, ponemos la url en la variable apiUrl
        const BACKEND_URL = 'https://proyectosantiago-production.up.railway.app';
        async function cargartareas() {
            try {
                const respuesta = await fetch(`${BACKEND_URL}/tareas`);
                const tareas = await respuesta.json();
                const listaTareasDiv = document.getElementById('Lista de tareas');
                listaTareasDiv.innerHTML = ''; // Limpiar la lista antes de agregar nuevas tareas
                tareas.forEach(tarea => {
                    listaTareasDiv.innerHTML +=`
                    <div class="tarea">
                        <strong>${tarea.titulo}</strong>
                        <p style="margin: 5px 0;">${tarea.descripcion}</p>
                    </div>`;
                });
            } catch (error) {
                console.error('Error al cargar las tareas:', error);
            }
        }

        async function GuardarTarea() {
            const titulo = document.getElementById('taskInput').value;
            const descripcion = document.getElementById('descriptionInput').value;

            if (!titulo || !descripcion) {
                alert('Por favor llena el título y la descripción');
                return;
            }

            try {
                const params = new URLSearchParams({ titulo, descripcion });
                const respuesta = await fetch(`${BACKEND_URL}/tareas?${params.toString()}`, {
                    method: 'POST'
                });

                if (!respuesta.ok) {
                    throw new Error(`Error del servidor: ${respuesta.status}`);
                }

                document.getElementById('taskInput').value = '';
                document.getElementById('descriptionInput').value = '';

                await cargartareas();
            } catch (error) {
                console.error('Error al guardar la tarea:', error);
                alert('No se pudo guardar la tarea');
            }
        }

        // Cargar las tareas apenas se abre la página
        cargartareas();
    </script>
</body>
</html>
